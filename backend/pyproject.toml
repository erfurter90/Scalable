[tool.ruff]
target-version = "py312"
line-length = 115
extend-exclude = ["alembic/versions"]  # autogenerated migrations — not hand-formatted

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "FURB", "DTZ"]
ignore = [
    "B008",   # FastAPI's `Depends(...)` as a default argument is the framework's own idiom.
    "DTZ011", # date.today() is intentional here: snapshot_date/score_date are calendar dates, not instants.
]

[tool.black]
target-version = ["py312"]
line-length = 115
extend-exclude = "/alembic/versions/"
